<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pizza Maker</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <p id="studentInfo"></p>
    <h1>The Pizza Maker</h1>
    <section id="output"></section>
  </main>
  <form id="pizzaForm">
  <label for="name">Name</label>
  <input type="text" id="name" required>

  <label for="size">Size</label>
  <select id="size" required>
    <option value="">Select size</option>
    <option value="Small">Small</option>
    <option value="Medium">Medium</option>
    <option value="Large">Large</option>
  </select>

  <label for="crust">Crust</label>
  <select id="crust" required>
    <option value="">Select crust</option>
    <option value="Thin">Thin</option>
    <option value="Hand Tossed">Hand Tossed</option>
    <option value="Cheese Burst">Cheese Burst</option>
  </select>

  <label for="sauce">Sauce</label>
  <select id="sauce" required>
    <option value="">Select sauce</option>
    <option value="Tomato">Tomato</option>
    <option value="BBQ">BBQ</option>
    <option value="Alfredo">Alfredo</option>
  </select>

  <fieldset>
    <legend>Cheese</legend>
    <label><input type="radio" name="cheese" value="Light" required> Light</label>
    <label><input type="radio" name="cheese" value="Regular"> Regular</label>
    <label><input type="radio" name="cheese" value="Extra"> Extra</label>
  </fieldset>

  <fieldset>
    <legend>Toppings (choose at least 2)</legend>
    <label><input type="checkbox" name="topping" value="Pepperoni"> Pepperoni</label>
    <label><input type="checkbox" name="topping" value="Mushrooms"> Mushrooms</label>
    <label><input type="checkbox" name="topping" value="Onions"> Onions</label>
    <label><input type="checkbox" name="topping" value="Olives"> Olives</label>
  </fieldset>

  <label for="instructions">Special instructions</label>
  <textarea id="instructions" rows="4"></textarea>

  <button type="submit">Order</button>
</form>
</body>
<footer>
<p>Created by Vrushil Panchal | Roll No. 200628377</p>
</footer>
</html>
